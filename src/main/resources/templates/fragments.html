<!DOCTYPE html>
<html lang="fa" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<!--
  Shared <head>. The stylesheet is inlined on purpose: on a slow mobile connection the page
  renders from the first response, with no second round trip for CSS. Fonts load afterwards
  (font-display: swap) and are cached for a year under a content-hashed URL.
  No URL in this file may point to another host.

  Look: white paper, bottle-green ink, and one loud colour, price-tag yellow. Yellow is only
  ever a tag: the header of the price demo, the header of the form, the success mark.
  Lalezar (sign-painter display face) is for the headline, the wordmark and prices;
  Vazirmatn is for everything that is read or tapped.
-->
<head th:fragment="head">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>همگام | پیش‌ثبت‌نام</title>
<meta name="theme-color" content="#0d2b21">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d2b21'/%3E%3Cg fill='none' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M7 14h9V8h9' stroke='%23ffd43b'/%3E%3Cpath d='M7 24h9v-6h9' stroke='%23fff'/%3E%3C/g%3E%3C/svg%3E">
<style th:inline="css">
@font-face{font-family:Vazirmatn;font-weight:400;font-style:normal;font-display:swap;src:url([(@{/fonts/Vazirmatn-Regular.woff2})]) format("woff2")}
@font-face{font-family:Vazirmatn;font-weight:700;font-style:normal;font-display:swap;src:url([(@{/fonts/Vazirmatn-Bold.woff2})]) format("woff2")}
@font-face{font-family:Lalezar;font-weight:400;font-style:normal;font-display:swap;src:url([(@{/fonts/Lalezar-Regular.woff2})]) format("woff2")}
:root{--paper:#fff;--wash:#eef3ef;--ink:#0d2b21;--ink-2:#1b4a39;--soft:#4b6157;--line:#d3dcd6;--edge:#7d9087;--tag:#ffd43b;--err:#b3261e;--err-bg:#fcedeb}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.9 Vazirmatn,Tahoma,"Segoe UI",sans-serif}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* Brand */
.top{max-width:38rem;margin:0 auto;padding:1rem 1.15rem 0}
.brand{display:flex;align-items:center;gap:.5rem;font:400 1.6rem/1.2 Lalezar,Vazirmatn,Tahoma,sans-serif}
.mark{flex:none;width:2rem;height:2rem;border-radius:.5rem}

/* Landing: one column on a phone, story + sticky form from 60rem up */
.page{max-width:38rem;margin:0 auto;padding:0 1.15rem 2.5rem}
h1{margin:1.5rem 0 .8rem;font:400 clamp(2.15rem,1.25rem + 4.4vw,3.5rem)/1.5 Lalezar,Vazirmatn,Tahoma,sans-serif;text-wrap:balance}
.lead{margin:0 0 1.4rem;max-width:34rem;color:var(--soft)}

.btn{display:block;width:100%;min-height:3.6rem;padding:.65rem 1rem;border:0;border-radius:.9rem;background:var(--ink);color:#fff;font:700 1.125rem/2.3rem Vazirmatn,Tahoma,sans-serif;text-align:center;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn:hover{background:var(--ink-2)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.6}

/* Price demo: a tag whose numbers follow the rate */
.demo{margin:2.4rem 0 0}
.tag{border:2px solid var(--ink);border-radius:1.5rem;overflow:hidden;background:var(--paper)}
.rate{padding:1rem 1.15rem 1.05rem;background:var(--tag)}
.rate label{display:block;font-weight:700;line-height:1.7}
.rate-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.2rem .8rem}
.rate-now{font:400 2.5rem/1.35 Lalezar,Vazirmatn,Tahoma,sans-serif;white-space:nowrap}
.rate-now small,.now small{font:700 .9375rem/1 Vazirmatn,Tahoma,sans-serif}
.delta{padding:.15rem .8rem;border-radius:999px;background:var(--ink);color:var(--tag);font-weight:700;font-size:.9375rem;line-height:1.9;white-space:nowrap}
.rate input[type=range]{--p:.2;display:block;width:100%;height:2.75rem;margin:.15rem 0 0;padding:0;border:0;background:none;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:pan-y}
.rate input[type=range]::-webkit-slider-runnable-track{height:.5rem;border-radius:999px;background:linear-gradient(to left,var(--ink) calc(1rem + (100% - 2rem)*var(--p)),rgba(13,43,33,.22) 0)}
.rate input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:2rem;height:2rem;margin-top:-.75rem;border:.3rem solid var(--paper);border-radius:50%;background:var(--ink)}
.rate input[type=range]::-moz-range-track{height:.5rem;border-radius:999px;background:linear-gradient(to left,var(--ink) calc(1rem + (100% - 2rem)*var(--p)),rgba(13,43,33,.22) 0)}
.rate input[type=range]::-moz-range-thumb{width:2rem;height:2rem;border:.3rem solid var(--paper);border-radius:50%;background:var(--ink);box-sizing:border-box}
.rate input[type=range]:focus-visible{outline:0}
.rate input[type=range]:focus-visible::-webkit-slider-thumb{outline:3px solid var(--ink);outline-offset:2px}
.rate input[type=range]:focus-visible::-moz-range-thumb{outline:3px solid var(--ink);outline-offset:2px}
.rate-hint{margin:0;font-size:.9375rem;line-height:1.6}
.rows{margin:0;padding:0;list-style:none;border-top:2px solid var(--ink)}
.rows li{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.75rem 1.15rem}
.rows li+li{border-top:1px solid var(--line)}
.rows b{display:block;line-height:1.7}
.rows small{display:block;color:var(--soft);font-size:.875rem;line-height:1.7}
.rows .now small{display:inline;color:inherit}
.rows .price{flex:none;text-align:end}
.now{display:block;font:400 1.6rem/1.35 Lalezar,Vazirmatn,Tahoma,sans-serif;white-space:nowrap}
.demo-note{margin:.6rem .2rem 0;color:var(--soft);font-size:.875rem;line-height:1.8}

/* Benefits: plain reading, no boxes */
.benefits{margin:2.6rem 0 0;padding:0;list-style:none}
.benefits li{padding:1.15rem 0 1.25rem;border-top:1px solid var(--line)}
.benefits h2{margin:0 0 .2rem;font-size:1.2rem;line-height:1.8;font-weight:700}
.benefits p{margin:0;max-width:34rem;color:var(--soft)}

/* Form panel: the offer is its tag */
.join{margin-top:2.2rem;scroll-margin-top:1rem}
.offer{margin:0;padding:.95rem 1.15rem 1rem;background:var(--tag);border-bottom:2px solid var(--ink);font-weight:700;line-height:1.9}
.join-body{padding:1.1rem 1.15rem 1.25rem}
.join-body>p:first-child{margin:0;color:var(--soft)}
label.field{display:block;margin:1.15rem 0 .4rem;font-weight:700}
fieldset{margin:1.3rem 0 0;padding:0;border:0;min-width:0}
legend{display:block;margin:0 0 .55rem;padding:0;font-weight:700;line-height:1.8}
.hint{display:block;color:var(--soft);font-weight:400;font-size:.9375rem}
input[type=tel],input[type=text]{display:block;width:100%;min-height:3.6rem;padding:.4rem 1rem;border:2px solid var(--edge);border-radius:.9rem;background:var(--paper);color:var(--ink);font:400 1.35rem/1.6 Vazirmatn,Tahoma,sans-serif;direction:ltr;text-align:left;letter-spacing:.06em}
input[type=tel]::placeholder,input[type=text]::placeholder{color:#9aa8a1;letter-spacing:.06em}
input[type=tel]:focus,input[type=text]:focus{border-color:var(--ink);outline:3px solid var(--tag);outline-offset:0}
input.code{text-align:center;letter-spacing:.45em;font-weight:700;font-size:1.6rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{position:relative;display:block}
.chip input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.chip span{display:flex;align-items:center;gap:.45rem;min-height:2.9rem;padding:.3rem 1rem;border:1.5px solid var(--edge);border-radius:999px;background:var(--paper);line-height:2.1rem}
.chip input:checked+span{background:var(--ink);border-color:var(--ink);color:#fff}
.chip input:checked+span::before{content:"";width:.5rem;height:.9rem;margin:-.2rem .15rem 0;border:solid var(--tag);border-width:0 .2rem .2rem 0;transform:rotate(45deg)}
.chip input:focus-visible+span{outline:3px solid var(--ink);outline-offset:3px}
.join .btn,.solo .btn{margin-top:1.5rem}
.fine{margin:.9rem 0 0;color:var(--soft);font-size:.875rem;line-height:1.85}
.err{margin:1rem 0 0;padding:.7rem .95rem;border-radius:.75rem;background:var(--err-bg);color:var(--err);font-weight:700;line-height:1.9}

/* Phone only: the button follows the reader until the form is on screen */
.bar{position:fixed;inset:auto 0 0 0;z-index:5;padding:.7rem 1.15rem calc(.7rem + env(safe-area-inset-bottom));background:var(--paper);border-top:2px solid var(--ink);transform:translateY(110%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
.bar.on{transform:none;visibility:visible;transition:transform .25s ease}
.bar .btn{max-width:35.7rem;margin:0 auto}

/* Code and thank-you pages */
.solo{max-width:30rem;margin:0 auto;padding:0 1.15rem 2.5rem}
.top.narrow{max-width:30rem}
.solo h1{margin-top:2rem;font-size:2rem}
.solo .lead{margin-bottom:.4rem}
.solo bdi{color:var(--ink);font-weight:700;white-space:nowrap}
.quiet{display:flex;flex-wrap:wrap;gap:.4rem 1.6rem;align-items:center;margin-top:1.1rem}
.link{padding:.5rem 0;border:0;background:none;color:var(--ink);font:700 1rem/1.8 Vazirmatn,Tahoma,sans-serif;text-decoration:underline;text-decoration-thickness:.12em;text-underline-offset:.35em;cursor:pointer}
.stamp{display:block;width:4.5rem;height:4.5rem;margin:2.6rem 0 0;border:2px solid var(--ink);border-radius:50%;background:var(--tag)}
.stamp+h1{margin-top:1.1rem}
.share{margin:2rem 0 0;padding-top:1.3rem;border-top:1px solid var(--line)}
.share p{margin:0}
.share .btn{margin-top:1rem}
.share [role=status]{margin-top:.7rem;font-weight:700}
footer{margin:2.2rem 0 0;padding-top:1.1rem;border-top:1px solid var(--line);color:var(--soft);font-size:.9375rem;line-height:1.9}

@media (min-width:60rem){
  .top{max-width:68rem;padding:1.6rem 2rem 0}
  .page{max-width:68rem;padding:0 2rem 4rem;display:grid;grid-template-columns:minmax(0,1fr) 25rem;column-gap:4.5rem;align-items:start}
  h1{margin-top:2.4rem;line-height:1.38}
  .hero .btn,.bar{display:none}
  .join{margin-top:2.6rem}
  .top.narrow{max-width:30rem;padding:1.6rem 1.15rem 0}
}
@media (min-width:60rem) and (min-height:56rem){.join{position:sticky;top:1.5rem}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.bar,.bar.on{transition:none}}
</style>
</head>
<body>
<!-- Wordmark, shared by every public page. -->
<div th:fragment="brand" class="brand">
  <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
    <rect width="32" height="32" fill="#0d2b21"/>
    <g fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 14h9V8h9" stroke="#ffd43b"/>
      <path d="M7 24h9v-6h9" stroke="#fff"/>
    </g>
  </svg>
  همگام
</div>
</body>
</html>
