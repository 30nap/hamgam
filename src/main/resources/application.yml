spring:
  application:
    name: hamgam-landing
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hamgam}
    username: ${DB_USER:hamgam}
    password: ${DB_PASSWORD:hamgam}
    hikari:
      maximum-pool-size: 10
  threads:
    virtual:
      enabled: true
  web:
    resources:
      # Static files get a content hash in their URL, so they can be cached "forever".
      chain:
        strategy:
          content:
            enabled: true
            paths: /**
      cache:
        cachecontrol:
          max-age: 365d
          cache-public: true
          immutable: true

server:
  port: ${PORT:8080}
  # Behind nginx: take client IP and scheme from X-Forwarded-* (only trusted from private addresses).
  forward-headers-strategy: native
  tomcat:
    use-relative-redirects: true
  compression:
    enabled: true
    min-response-size: 512
    mime-types: text/html,text/css,application/javascript,text/javascript,text/csv,text/plain

hamgam:
  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
  sms:
    provider: ${SMS_PROVIDER:console}   # console | kavenegar
    kavenegar:
      api-key: ${KAVENEGAR_API_KEY:}
      template: ${KAVENEGAR_OTP_TEMPLATE:}
      base-url: ${KAVENEGAR_BASE_URL:https://api.kavenegar.com}
  otp:
    ttl: ${OTP_TTL:2m}
    hmac-secret: ${OTP_HMAC_SECRET:}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    phone-cooldown: ${OTP_PHONE_COOLDOWN:60s}
    phone-daily-limit: ${OTP_PHONE_DAILY_LIMIT:5}
    # Iranian mobile carriers put many subscribers behind one address, so keep this generous.
    ip-hourly-limit: ${OTP_IP_HOURLY_LIMIT:30}
