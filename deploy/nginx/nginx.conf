worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    client_max_body_size 16k;          # the only uploads are tiny form posts

    # Text compresses well; woff2 fonts are already compressed.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript text/plain text/csv image/svg+xml;

    # Outer safety net against floods. The real per-phone / per-IP OTP limits live in the app.
    limit_req_zone $binary_remote_addr zone=forms:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=admin:10m rate=20r/m;
    limit_req_status 429;

    # Trust the CDN's scheme header if present, otherwise use the real one.
    map $http_x_forwarded_proto $client_scheme {
        default $scheme;
        https   https;
    }

    upstream hamgam_app {
        server app:8080;
        keepalive 16;
    }

    # Optional extras, each a file in deploy/nginx/conf.d/:
    #   realip.conf  - restore the visitor's IP when a CDN sits in front (http context)
    #   tls.conf     - HTTPS listener with an origin certificate (server context, see include below)
    include /etc/nginx/conf.d/http-*.conf;

    server {
        listen 80 default_server;
        server_name _;

        include /etc/nginx/conf.d/server-*.conf;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite (never append): a visitor must not be able to forge their own address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $client_scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        location ~ ^/(signup|verify|resend)$ {
            limit_req zone=forms burst=20 nodelay;
            proxy_pass http://hamgam_app;
        }

        location /admin {
            limit_req zone=admin burst=20 nodelay;
            proxy_pass http://hamgam_app;
        }

        location / {
            proxy_pass http://hamgam_app;
        }
    }
}
